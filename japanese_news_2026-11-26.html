<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해피라이프 일본어 2026-11-26</title><style>body{font:17px/1.8 system-ui,sans-serif;background:#f3f6fa;color:#162d3d;max-width:850px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:14px;margin:20px 0}button,select{font:inherit;padding:6px 12px;border:1px solid #aab9c7;border-radius:8px;background:#eef5fc;cursor:pointer}li{margin:15px 0}summary{cursor:pointer;color:#386080}small{color:#526575}progress{width:100%}</style><h1>ニュースで学ぶ日本語</h1><p>해피라이프 · 2026.11.26 · N4–N3 · 30분</p><p>읽기 10분 · 듣기 10분 · 단어/문법/퀴즈 10분</p><label>듣기 속도 <select id="rate"><option value="0.75">느리게</option><option value="1" selected>보통</option></select></label> <button onclick="speechSynthesis.cancel()">정지</button><p id="msg"></p><progress id="progress" max="24" value="0"></progress><p id="count"></p><main id="main"></main><script>const data=[["日銀、追加利上げを急ぐ可能性", "일본은행 추가 금리 인상 가능성", ["日本銀行の田村審議委員は、今後の利上げについて意見を述べました。", "原油や原材料の価格が上がっています。", "円安も物価上昇の原因の一つになっています。", "物価の動きに早く対応する必要があります。", "現在、日本銀行の政策金利は1.25％です。", "市場では12月に1.5％まで引き上げられるという見方が広がっています。", "金利が上がると、住宅ローンにも影響が出ます。", "今後の判断に注目が集まっています。"], ["다무라 심의위원은 향후 금리 인상에 대해 의견을 밝혔습니다.", "원유와 원재료 가격이 오르고 있습니다.", "엔화 약세도 물가 상승의 원인 중 하나입니다.", "물가 움직임에 신속하게 대응할 필요가 있습니다.", "현재 일본은행 정책금리는 1.25%입니다.", "시장에서는 12월에 1.5%까지 인상될 것이라는 전망이 확산합니다.", "금리가 오르면 주택담보대출에도 영향을 미칩니다.", "향후 판단에 관심이 집중됩니다."], "利上げ:りあげ:금리 인상,原油:げんゆ:원유,原材料:げんざいりょう:원재료,円安:えんやす:엔화 약세,物価:ぶっか:물가,政策金利:せいさくきんり:정책금리,判断:はんだん:판단,注目:ちゅうもく:주목", "～と:~하면:金利が上がると、負担が増えます。", "https://www.reuters.com/markets/us/bojs-tamura-signals-chance-faster-pace-interest-rate-hikes-2026-11-26/"], ["米国、追加関税を検討", "미국 추가 관세 검토", ["アメリカ政府は新たな関税を検討しています。", "対象には日本、中国、韓国などが含まれています。", "日本からの輸入品に対する関税は最大15％になる可能性があります。", "現在の一般税率は12.5％です。", "関税が上がると、輸出企業の負担が増える可能性があります。", "商品の価格にも影響が出るかもしれません。", "日本企業は今後の政策を見守っています。", "日米の経済関係にも関心が集まっています。"], ["미국 정부는 새로운 관세를 검토하고 있습니다.", "대상에는 일본 중국 한국 등이 포함됩니다.", "일본산 수입품 관세는 최대 15%가 될 가능성이 있습니다.", "현재 일반 관세율은 12.5%입니다.", "관세가 오르면 수출기업의 부담이 늘어날 가능성이 있습니다.", "상품 가격에도 영향이 생길 수 있습니다.", "일본 기업은 향후 정책을 지켜보고 있습니다.", "미일 경제 관계에도 관심이 집중됩니다."], "関税:かんぜい:관세,追加:ついか:추가,検討:けんとう:검토,対象:たいしょう:대상,輸入品:ゆにゅうひん:수입품,税率:ぜいりつ:세율,輸出:ゆしゅつ:수출,負担:ふたん:부담", "～かもしれない:~할지도 모른다:価格が上がるかもしれません。", "https://asiaaquaculture.online/articles/-/92639"], ["PayPayの決済システム障害が復旧", "결제 시스템 장애 복구", ["PayPayでシステム障害が発生しました。", "25日の午後8時すぎから、一部の決済サービスが利用できなくなりました。", "クレジットカードと連携したサービスに影響が出ました。", "26日の午前4時50分ごろに復旧しました。", "キャッシュレス決済は生活に欠かせないものになっています。", "問題が起きると、買い物ができなくなる場合もあります。", "ほかの支払い方法を用意しておくことも大切です。", "企業には安定したサービスの提供が求められています。"], ["페이페이에서 시스템 장애가 발생했습니다.", "25일 오후 8시 이후 일부 결제 서비스를 이용할 수 없게 되었습니다.", "신용카드 연동 서비스에 영향이 있었습니다.", "26일 오전 4시 50분경 복구되었습니다.", "현금 없는 결제는 생활에 필수적인 것이 되었습니다.", "문제가 생기면 쇼핑을 하지 못할 수도 있습니다.", "다른 결제 방법을 준비해 두는 것도 중요합니다.", "기업에는 안정적인 서비스 제공이 요구됩니다."], "決済:けっさい:결제,障害:しょうがい:장애,発生:はっせい:발생,利用:りよう:이용,連携:れんけい:연동,復旧:ふっきゅう:복구,現金:げんきん:현금,提供:ていきょう:제공", "～ておく:미리 ~해 두다:現金を用意しておきます。", "https://kumanichi.com/news/zenkoku/economy?page=14"]];const key='happy-2026-11-26';let done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}function update(){let n=Object.values(done).filter(Boolean).length;document.getElementById('progress').value=n;document.getElementById('count').textContent=n+'/24 문장 완료';try{localStorage.setItem(key,JSON.stringify(done))}catch(e){}}function speak(s){if(!('speechSynthesis' in window)){document.getElementById('msg').textContent='이 브라우저는 음성 기능을 지원하지 않습니다.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=Number(document.getElementById('rate').value);let v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));if(v)u.voice=v;u.onerror=()=>document.getElementById('msg').textContent='일본어 음성 설정을 확인하세요.';speechSynthesis.speak(u)}const el=(tag,txt,parent)=>{let e=document.createElement(tag);e.textContent=txt;parent.append(e);return e};function btn(txt,p,fn){let b=el('button',txt,p);b.onclick=fn}data.forEach((a,i)=>{let s=el('section','',document.getElementById('main'));el('h2',a[0],s);el('p',a[1],s);let ol=el('ol','',s);a[2].forEach((j,k)=>{let li=el('li','',ol);let p=el('p',j,li);p.lang='ja';btn('▶ 듣기',li,()=>speak(j));let c=document.createElement('input');c.type='checkbox';let id=i+'-'+k;c.checked=!!done[id];c.onchange=()=>{done[id]=c.checked;update()};let label=el('label',' 완료 ',li);label.prepend(c);let d=el('details','',li);el('summary','한국어 번역',d);el('p',a[3][k],d)});el('h3','단어 카드',s);let words=a[4].split(',').map(w=>w.split(':'));words.forEach(w=>{let d=el('details','',s);el('summary',w[0],d);el('span',w[1]+' · '+w[2]+' ',d);btn('듣기',d,()=>speak(w[0]))});el('h3','문법',s);el('p',a[5].split(':').join(' — '),s);el('h3','복습 퀴즈',s);[0,1].forEach(k=>{let q=el('p',words[k][0]+'의 뜻은?',s);let options=[words[k][2],words[k+2][2],words[k+4][2]];if(k===0)options.reverse();let feedback=el('span','',s);options.forEach(o=>btn(o,s,()=>feedback.textContent=o===words[k][2]?'정답!':'다시 생각해 보세요.'));});let link=el('a','원문 출처',s);link.href=a[6];link.target='_blank'});update();</script></html>
